<!-- CẤU PHẦN LIÊN HỆ - GLADIA BY THE WATERS -->
<section class="contact-section" id="lien-he">
  <div class="container">
    
    <div class="contact-inner">
      
      <!-- Khối thông tin kết nối trực tiếp bên trái -->
      <div class="contact-left reveal">
        <span class="section-label">Đăng Ký Đặc Quyền</span>
        <h2>Nhận Giải Pháp<br>Dòng Tiền Độc Quyền</h2>
        <div class="gold-line"></div>
        <p class="contact-desc" style="color: rgba(255,255,255,0.6); line-height: 1.75; margin-bottom: 30px;">
          Hào Sky Land sẽ bảo mật tuyệt đối thông tin và liên hệ trực tiếp để gửi tới Chị bảng tính toán bài toán dòng tiền, tiến độ thanh toán chi tiết cùng quỹ căn ngoại giao đợt 1.
        </p>
        
        <div class="contact-detail">
          <a href="tel:0986986049">Hotline: 0986 986 049</a>
          <a href="mailto:haoskyland@gmail.com">Email: haoskyland@gmail.com</a>
        </div>
      </div>

      <!-- Khối biểu mẫu đăng ký kết nối API Telegram bên phải -->
      <div class="contact-right reveal" style="transition-delay: 0.1s;">
        <form id="leadForm">
          
          <!-- Trường nhập tên khách hàng -->
          <div class="form-group">
            <label for="formName">Tên khách hàng (Info 1)</label>
            <input type="text" id="formName" placeholder="Ví dụ: Chị Minh Anh" required>
          </div>

          <!-- Trường nhập số điện thoại -->
          <div class="form-group">
            <label for="formPhone">Số điện thoại (Info 2)</label>
            <input type="tel" id="formPhone" placeholder="Ví dụ: 0912345678" required>
          </div>

          <!-- Trường nhập địa chỉ email -->
          <div class="form-group">
            <label for="formEmail">Địa chỉ Email</label>
            <input type="email" id="formEmail" placeholder="Ví dụ: minhanh@gmail.com" required>
          </div>

          <!-- Dòng tùy chọn loại căn hộ và mục đích đầu tư -->
          <div class="form-row">
            <div class="form-group">
              <label for="formProduct">Nhu cầu căn hộ</label>
              <select id="formProduct">
                <option value="1 Phòng Ngủ">Căn hộ 1 PN</option>
                <option value="2 Phòng Ngủ" selected>Căn hộ 2 PN</option>
                <option value="3 Phòng Ngủ">Căn hộ 3 PN</option>
                <option value="Duplex / Penthouse">Duplex / Penthouse</option>
              </select>
            </div>
            <div class="form-group">
              <label for="formPurpose">Mục đích đầu tư</label>
              <select id="formPurpose">
                <option value="Tối ưu dòng tiền">Tối ưu dòng tiền</option>
                <option value="Tích sản dài hạn">Tích sản dài hạn</option>
                <option value="Mua ở hạng sang">Mua ở hạng sang</option>
              </select>
            </div>
          </div>

          <!-- Trường ghi chú bổ sung thông tin -->
          <div class="form-group">
            <label for="formNote">Ghi chú yêu cầu riêng</label>
            <textarea id="formNote" rows="3" placeholder="Ví dụ: Cần tư vấn lịch thanh toán giãn bằng vốn tự có..."></textarea>
          </div>

          <!-- Nút kích hoạt gửi dữ liệu realtime về Telegram -->
          <button type="submit" class="form-submit">Đăng Ký Nhận Quỹ Căn Chi Tiết</button>
          
        </form>
      </div>

    </div>
  </div>
</section>
