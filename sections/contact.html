<!-- CẤU PHẦN LIÊN HỆ - GLADIA HEIGHTS -->
<section class="contact-section" id="contact">
  <div class="container">
    <div class="contact-inner">
      
      <!-- Khối thông tin kết nối trực tiếp bên trái -->
      <div class="contact-left reveal">
        <div class="section-label">Liên Hệ</div>
        <h2>Đăng Ký<br>Tư Vấn Ngay</h2>
        <div class="gold-line"></div>
        <p>Điền thông tin bên cạnh hoặc liên hệ trực tiếp để nhận tài liệu dự án & được tư vấn miễn phí.</p>
        <div class="contact-detail">
          <a href="tel:0986986049">📞 0986 986 049</a>
          <a href="mailto:haoskyland@gmail.com">✉ haoskyland@gmail.com</a>
          <span style="color:rgba(255,255,255,0.45);font-size:0.82rem">32 Song Hành, Phường Bình Trưng TP.HCM</span>
        </div>
      </div>
      
      <!-- Khối biểu mẫu đăng ký kết nối API Telegram bên phải -->
      <form id="contactForm" class="reveal">
        <div class="form-row">
          <div class="form-group">
            <label>Họ và Tên *</label>
            <input type="text" name="name" placeholder="Nguyễn Văn A" required>
          </div>
          <div class="form-group">
            <label>Số Điện Thoại *</label>
            <input type="tel" name="phone" placeholder="0909 xxx xxx" required>
          </div>
        </div>
        <div class="form-group">
          <label>Email</label>
          <input type="email" name="email" placeholder="email@example.com">
        </div>
        <div class="form-group">
          <label>Loại Căn Hộ Quan Tâm</label>
          <select name="apartment_type">
            <option value="Chưa chọn">Chọn loại căn hộ</option>
            <option value="1Phòng ngủ (1PN)">1 Phòng ngủ (1PN)</option>
            <option value="1Phòng ngủ + (1PN+)">1 Phòng ngủ + (1PN+)</option>
            <option value="2Phòng ngủ (2PN)">2 Phòng ngủ (2PN)</option>
            <option value="2Phòng ngủ + (2PN+)">2 Phòng ngủ + (2PN+)</option>
            <option value="3Phòng ngủ (3PN)">3 Phòng ngủ (3PN)</option>
             <option value="4Phòng ngủ (4PN)">4 Phòng ngủ (4PN)</option>
          </select>
        </div>
        <div class="form-group">
          <label>Mục Đích</label>
          <select name="purpose">
            <option value="Chưa chọn">Chọn mục đích</option>
            <option value="Để ở">Để ở</option>
            <option value="Đầu tư">Đầu tư</option>
            <option value="Vừa ở vừa đầu tư">Vừa ở vừa đầu tư</option>
          </select>
        </div>
        <div class="form-group">
          <label>Ghi Chú</label>
          <textarea name="note" placeholder="Thông tin thêm..." rows="3" style="resize:vertical"></textarea>
        </div>
        
        <button type="submit" class="form-submit">
          ✦ Gửi Đăng Ký Ngay
        </button>
        <p style="font-size:0.72rem;color:rgba(255,255,255,0.3);margin-top:12px;line-height:1.5">* Thông tin của Quý khách sẽ không được công khai hoặc dùng với mục đích spam.</p>
      </form>

    </div>
  </div>
</section>
